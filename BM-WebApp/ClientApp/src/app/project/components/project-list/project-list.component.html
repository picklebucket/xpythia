<app-header></app-header>
<div class="container-fluid">
  <div class="row clearfix">
    <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let project of projects">
      <div class="card project_widget">
        <div class="pw_img">
          <img class="img-fluid" [src]="project.image">
        </div>
        <div class="pw_content">
          <div class="pw_header">
            <h6>{{project.name}}</h6>
            <ul class="list-unstyled team-info margin-0 p-t-15">
              <li class="m-r-15"><small>Team</small></li>
              <li><img src="../assets/images/xs/avatar1.jpg" alt="Avatar"></li>
              <li><img src="../assets/images/xs/avatar2.jpg" alt="Avatar"></li>
              <li><img src="../assets/images/xs/avatar8.jpg" alt="Avatar"></li>
              <li><img src="../assets/images/xs/avatar10.jpg" alt="Avatar"></li>
              <li><a href="javascript:void(0);" title="Add Member"><i class="zmdi zmdi-plus-circle"></i></a></li>
            </ul>
          </div>
          <div class="pw_meta">
            <p> {{project.details}}</p>
            <button class="btn btn-primary btn-simple btn-round" [routerLink]="['/', project.name]">
              More
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
