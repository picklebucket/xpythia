<section class="content" style="margin: 0px 15px 120px">
  <app-header></app-header>
  <div class="container-fluid">
    <div class="row clearfix">
      <div class="col-lg-12">
        <div class="card">
          <div class="body">
            <ul class="nav nav-tabs padding-0">
              <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#Permanent">Асtive</a></li>
              <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#Consultant">Not Асtive</a></li>
            </ul>
          </div>
        </div>
        <div class="tab-content m-t-10">
          <div class="tab-pane active" id="Permanent">
            <div class="row clearfix">
              <div class="col-lg-3 col-md-4 col-sm-6" *ngFor="let person of activePesonnel">
                <div class="card xl-blue member-card doctor">
                  <div class="body">
                    <div class="member-thumb">
                      <img src="../assets/images/doctors/member1.png" class="img-fluid" alt="profile-image">
                    </div>
                    <div class="detail">
                      <h4 class="m-b-0">{{person.name}}</h4>
                      <p class="text-muted">{{person.specialty}}</p>
                      <ul class="social-links list-inline m-t-20">
                        <li><a title="facebook" href="javascript:void(0);"><i class="zmdi zmdi-facebook"></i></a></li>
                        <li><a title="twitter" href="javascript:void(0);"><i class="zmdi zmdi-twitter"></i></a></li>
                        <li><a title="instagram" href="javascript:void(0);"><i class="zmdi zmdi-email"></i></a></li>
                      </ul>
                      <p class="text-muted">{{person.address}}</p>
                      <a [routerLink]="['/' + person.projectName + '/personnel/persondetail']" class="btn btn-default btn-round btn-simple">View Profile</a> <!--"['/:projectname/personnel/persondetail']"--> 
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane" id="Consultant">
            <div class="row clearfix">
              <div class="col-lg-3 col-md-4 col-sm-6" *ngFor="let person of notActivePesonnel">
                <div class="card xl-khaki member-card doctor">
                  <div class="body">
                    <div class="member-thumb">
                      <img src="../assets/images/doctors/member2.png" class="img-fluid" alt="profile-image">
                    </div>
                    <div class="detail">
                      <h4 class="m-b-0">{{person.name}}</h4>
                      <p class="text-muted">{{person.specialty}}</p>
                      <ul class="social-links list-inline m-t-20">
                        <li><a title="facebook" href="javascript:void(0);"><i class="zmdi zmdi-facebook"></i></a></li>
                        <li><a title="twitter" href="javascript:void(0);"><i class="zmdi zmdi-twitter"></i></a></li>
                        <li><a title="instagram" href="javascript:void(0);"><i class="zmdi zmdi-email"></i></a></li>
                      </ul>
                      <p class="text-muted">{{person.address}}</p>
                      <a [routerLink]="['/' + person.projectName + '/personnel/persondetail']" class="btn btn-default btn-round btn-simple">View Profile</a> <!--"['/:projectname/personnel/persondetail']"-->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
