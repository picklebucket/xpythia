<div class="col-lg-4 col-md-6">
  <div class="card">
    <div class="body">
      <h3 class="number count-to m-b-0" data-from="0" data-to="1600" data-speed="2500" data-fresh-interval="700">{{ hoursWorked.number }}</h3>
      <p class="text-muted"> {{ hoursWorked.number }}</p>
      <div class="progress">
        <div class="progress-bar" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100" style="width: 68%;"></div>
      </div>
      <small>{{ hoursWorked.text }}</small>
    </div>
  </div>
</div>
